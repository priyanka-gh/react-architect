name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check-types
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      # VS Code needs a display; Linux runners don't have one.
      - run: xvfb-run -a npm run test:integration
        if: runner.os == 'Linux'
      - run: npm run test:integration
        if: runner.os != 'Linux'
      - run: npm run package

  # Creates real projects with create-vite and npm, then builds, lints and
  # tests them. Windows matters most here: that's where spawning npm breaks.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # So the pnpm and Yarn projects run too (they're skipped when missing).
      - run: npm install --global pnpm@12.22.0
      - run: yarn --version || npm install --global yarn@1.22.22
      - run: npm run test:e2e
        env:
          # One project starts with a git commit, which needs a name and email.
          GIT_AUTHOR_NAME: React Architect CI
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: React Architect CI
          GIT_COMMITTER_EMAIL: ci@example.invalid
